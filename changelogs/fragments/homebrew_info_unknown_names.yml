---
bugfixes:
  - homebrew_info, homebrew_cask_info, and homebrew_services_info - omit names that Homebrew does not know from the
    results instead of failing the whole query, including a cask name qualified with an installed tap that lacks it,
    such as C(hashicorp/tap/missing). Brew runs with E(HOMEBREW_NO_COLOR=1) and an empty E(GITHUB_ACTIONS) so unknown
    names are recognized when E(HOMEBREW_COLOR) is set and on GitHub Actions runners. A formula whose file Homebrew
    finds but cannot load, such as a tap formula that defines the wrong class, still fails the query.
  - homebrew_info, homebrew_cask_info, and homebrew_services_info - name the query and fall back to standard output in
    failure messages, and fail clearly when brew returns an unexpected structure.
trivial:
  - homebrew_info, homebrew_cask_info, homebrew_services_info, and launchd_info roles - verify unknown and mixed names
    in the Molecule scenarios.
