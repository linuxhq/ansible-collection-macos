---
bugfixes:
  - codex_marketplace - with O(state=absent), remove the marketplace with C(codex plugin marketplace remove) without
    listing marketplaces first, so it can be removed while a configured marketplace fails to load, and an installed
    marketplace directory C(.tmp/marketplaces/<name>) left in the Codex home directory without a configured
    marketplace is removed as well. In check mode, predict the removal when that directory exists or when Codex fails
    to list marketplaces because O(name) fails to load, instead of failing or reporting no change.
  - codex_marketplace - with O(state=absent), treat a listed marketplace without a configured source, such as a built-in
    or discovered marketplace, as already absent and report no change, in check mode too, instead of failing or
    predicting a change.
