---
bugfixes:
  - homebrew_info, homebrew_cask_info, homebrew_services_info, and launchd_info roles - build the published
    dictionaries with the built-in C(map) filter instead of C(json_query), removing the controller dependency on
    C(jmespath) and failing clearly instead of misaligning keys when an item lacks its key.
  - privoxy role - with C(privoxy_state=absent), stop the privoxy service with C(brew services stop) when Homebrew
    reports it registered, loaded or running, so a service that is not started, such as one that crashed, no longer
    leaves its launch agent and launchd job behind, and stop hiding service lookup failures.
