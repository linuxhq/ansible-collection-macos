---
breaking_changes:
  - codex_marketplace and codex_plugin - pass arguments to the Codex CLI literally. Environment variables such as
    C($HOME) and the home-directory prefixes C(~) and C(~user/) in arguments are no longer expanded, so an O(name) or
    O(marketplace) built from them, or a codex_marketplace O(source) such as C($HOME/marketplace) or
    C(~user/marketplace), must be written out in full. Codex still expands a leading C(~/) in the O(source) of a local
    marketplace (https://github.com/linuxhq/ansible-collection-macos/pull/80).
  - homebrew_info, homebrew_cask_info, and homebrew_services_info - pass names to brew literally. Environment
    variables such as C($HOME) and the home-directory prefixes C(~) and C(~user/) in names are no longer expanded
    (https://github.com/linuxhq/ansible-collection-macos/pull/80).
bugfixes:
  - codex_marketplace and codex_plugin - a name that contains an environment variable or C(~), such as C($USER), no
    longer selects a different marketplace or plugin (https://github.com/linuxhq/ansible-collection-macos/pull/80).
  - homebrew_info, homebrew_cask_info, and homebrew_services_info - a name that contains an environment variable or
    C(~), such as C($USER), no longer queries a different formula, cask, or service
    (https://github.com/linuxhq/ansible-collection-macos/pull/80).
  - codex_plugin - with O(state=absent), remove a plugin that Codex no longer lists only when its cache directory
    matches the case of O(marketplace) and O(name) exactly. On a case-insensitive file system, a name that differed
    only in case removed another installed plugin (https://github.com/linuxhq/ansible-collection-macos/pull/80).
minor_changes:
  - codex_marketplace and codex_plugin - run an existing O(executable) without first checking that it is an
    executable file; the system rejects one that cannot run
    (https://github.com/linuxhq/ansible-collection-macos/pull/80).
