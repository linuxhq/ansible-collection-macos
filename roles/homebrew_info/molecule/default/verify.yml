---
- name: Verify
  hosts: all
  roles:
    - role: homebrew_info
      homebrew_info_name: []

  post_tasks:
    - name: Ensure homebrew formulae information is verified
      tags:
        - homebrew_info
      ansible.builtin.assert:
        that:
          - _homebrew_info_dict | length == _homebrew_info_list | length
          - _homebrew_info_dict['buildkite-agent@3'].installed | length > 0
          - _homebrew_info_dict['buildkite-agent@3'].name == 'buildkite-agent@3'
          - _homebrew_info_dict['buildkite-agent@3'].versions.stable is string
          - _homebrew_info_dict['gitlab-runner'].installed | length > 0
          - _homebrew_info_dict['gitlab-runner'].name == 'gitlab-runner'
          - _homebrew_info_dict['gitlab-runner'].versions.stable is string

    - name: Ensure homebrew role is included with formula names
      tags:
        - homebrew_info
      ansible.builtin.include_role:
        name: homebrew_info

    - name: Ensure filtered homebrew formulae information is verified
      tags:
        - homebrew_info
      ansible.builtin.assert:
        that:
          - _homebrew_info_list | length == 2
          - _homebrew_info_dict | length == 2
          - _homebrew_info_dict['cloudflared'].name == 'cloudflared'
          - _homebrew_info_dict['cloudflared'].desc is string
          - _homebrew_info_dict['cloudflared'].installed[0].version is string
          - _homebrew_info_dict['cloudflared'].versions.stable is string
          - _homebrew_info_dict['privoxy'].name == 'privoxy'
          - _homebrew_info_dict['privoxy'].desc is string
          - _homebrew_info_dict['privoxy'].installed[0].version is string
          - _homebrew_info_dict['privoxy'].versions.stable is string

    - name: Ensure homebrew info role is included with an unknown name
      tags:
        - homebrew_info
      ansible.builtin.include_role:
        name: homebrew_info
      vars:
        homebrew_info_name:
          - linuxhq-missing-formula

    - name: Ensure unknown names are omitted
      tags:
        - homebrew_info
      ansible.builtin.assert:
        that:
          - _homebrew_info_list == []
          - _homebrew_info_dict == {}

    - name: Ensure homebrew info role is included with known and unknown names
      tags:
        - homebrew_info
      ansible.builtin.include_role:
        name: homebrew_info
      vars:
        homebrew_info_name:
          - privoxy
          - linuxhq-missing-formula

    - name: Ensure only known names are returned
      tags:
        - homebrew_info
      ansible.builtin.assert:
        that:
          - _homebrew_info_list | length == 1
          - _homebrew_info_dict | length == 1
          - _homebrew_info_dict['privoxy'].name == 'privoxy'

    - name: Ensure inventory lists are formatted
      tags:
        - homebrew_info
      ansible.builtin.set_fact:
        homebrew_list:
          "{{ homebrew_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure homebrew role is included
      tags:
        - homebrew_info
      ansible.builtin.include_role:
        name: homebrew
...
