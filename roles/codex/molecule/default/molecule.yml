---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: vagrant
  provider:
    name: tart

platforms:
  - name: tahoe
    hostname: false
    memory: 8192
    cpus: 4
    provider_options:
      disk: 60
      image: ghcr.io/cirruslabs/macos-tahoe-base:latest
      name: tahoe
    config_options:
      synced_folder: false
      ssh.username: admin
      ssh.password: admin
      vm.boot_timeout: 900

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        codex_config:
          approval_policy: never
          check_for_update_on_startup: false
          features:
            hooks: true
            memories: false
          model: gpt-6-astra
          model_reasoning_effort: medium
          notice:
            fast_default_opt_out: true
            hide_rate_limit_model_nudge: true
          plan_mode_reasoning_effort: medium
          projects:
            /Users/admin/molecule:
              trust_level: trusted
          sandbox_mode: danger-full-access
          tui:
            show_tooltips: false
        codex_marketplaces:
          - name: linuxhq
            source: https://github.com/linuxhq/cc-plugin-codex.git
            state: present
        codex_plugins:
          - marketplace: linuxhq
            name: claude
            state: present

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
