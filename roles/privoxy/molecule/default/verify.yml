---
- name: Verify
  hosts: all
  roles:
    - role: homebrew_services_info
      homebrew_services_info_name:
        - privoxy

  post_tasks:
    - name: Ensure privoxy configuration file status is gathered
      tags:
        - privoxy
      ansible.builtin.stat:
        path: /opt/homebrew/etc/privoxy/config
      register: __privoxy_present_stat

    - name: Ensure privoxy configuration file and service are verified
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - __privoxy_present_stat.stat.exists
          - _homebrew_services_info_dict['privoxy'].running

    - name: Ensure privoxy configuration has an invalid listen address
      tags:
        - privoxy
      ansible.builtin.lineinfile:
        line: listen-address 999.999.999.999:1
        path: /opt/homebrew/etc/privoxy/config
        state: present

    - name: Ensure privoxy service is restarted with the invalid configuration
      tags:
        - privoxy
      community.general.homebrew_services:
        name: privoxy
        state: restarted

    - name: Ensure privoxy service is registered but not started
      tags:
        - privoxy
      linuxhq.macos.homebrew_services_info:
        name: privoxy
      register: __privoxy_failed_services
      until:
        - __privoxy_failed_services.services | length == 1
        - __privoxy_failed_services.services[0].registered
        - __privoxy_failed_services.services[0].status not in ['started', 'scheduled']
      retries: 30
      delay: 2

    - name: Ensure privoxy role is included with an absent state
      tags:
        - privoxy
      ansible.builtin.include_role:
        name: privoxy
      vars:
        privoxy_state: absent

    - name: Ensure privoxy configuration file status is gathered after removal
      tags:
        - privoxy
      ansible.builtin.stat:
        path: /opt/homebrew/etc/privoxy/config
      register: __privoxy_absent_stat

    - name: Ensure privoxy launchd service information is gathered after removal
      tags:
        - privoxy
      linuxhq.macos.launchd_info:
        name:
          - homebrew.mxcl.privoxy
          - sh.brew.privoxy
      register: __privoxy_absent_launchd

    - name: Ensure privoxy launch agent status is gathered after removal
      tags:
        - privoxy
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ __privoxy_launch_agent }}.plist"
      loop:
        - homebrew.mxcl.privoxy
        - sh.brew.privoxy
      loop_control:
        loop_var: __privoxy_launch_agent
      register: __privoxy_absent_launch_agents

    - name: Ensure privoxy configuration file and service are absent
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - not __privoxy_absent_stat.stat.exists
          - __privoxy_absent_launchd.services | length == 0
          - __privoxy_absent_launch_agents.results | selectattr('stat.exists') | list | length == 0

    - name: Ensure privoxy package is installed without starting its service
      tags:
        - privoxy
      community.general.homebrew:
        name: privoxy
        state: present
        update_homebrew: false
        upgrade_all: false

    - name: Ensure privoxy service information is gathered before the unstarted removal
      tags:
        - privoxy
      linuxhq.macos.homebrew_services_info:
        name: privoxy
      register: __privoxy_unstarted_services

    - name: Ensure privoxy service is listed but not registered, loaded or running
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - __privoxy_unstarted_services.services | length == 1
          - not __privoxy_unstarted_services.services[0].registered
          - not __privoxy_unstarted_services.services[0].loaded
          - not __privoxy_unstarted_services.services[0].running

    - name: Ensure privoxy role is included with an absent state for an unstarted service
      tags:
        - privoxy
      ansible.builtin.include_role:
        name: privoxy
      vars:
        privoxy_state: absent

    - name: Ensure privoxy package information is gathered after the unstarted removal
      tags:
        - privoxy
      linuxhq.macos.homebrew_info:
        name: privoxy
      register: __privoxy_unstarted_formulae

    - name: Ensure privoxy unstarted removal skipped the service stop and removed the package
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - __privoxy_stop_result is skipped
          - __privoxy_stop_result is not changed
          - __privoxy_unstarted_formulae.formulae | length == 1
          - __privoxy_unstarted_formulae.formulae[0].installed | length == 0
...
