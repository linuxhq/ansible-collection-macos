---
- name: Verify
  hosts: all
  roles:
    - role: homebrew_services_info
      homebrew_services_info_name:
        - privoxy

  post_tasks:
    - name: Ensure privoxy configuration file status is gathered
      tags:
        - privoxy
      ansible.builtin.stat:
        path: /opt/homebrew/etc/privoxy/config
      register: __privoxy_present_stat

    - name: Ensure privoxy configuration file and service are verified
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - __privoxy_present_stat.stat.exists
          - _homebrew_services_info_dict['privoxy'].running

    - name: Ensure privoxy role is included with an absent state
      tags:
        - privoxy
      ansible.builtin.include_role:
        name: privoxy
      vars:
        privoxy_state: absent

    - name: Ensure privoxy configuration file status is gathered after removal
      tags:
        - privoxy
      ansible.builtin.stat:
        path: /opt/homebrew/etc/privoxy/config
      register: __privoxy_absent_stat

    - name: Ensure privoxy launchd service information is gathered after removal
      tags:
        - privoxy
      linuxhq.macos.launchd_info:
        name:
          - homebrew.mxcl.privoxy
          - sh.brew.privoxy
      register: __privoxy_absent_launchd

    - name: Ensure privoxy launch agent status is gathered after removal
      tags:
        - privoxy
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ __privoxy_launch_agent }}.plist"
      loop:
        - homebrew.mxcl.privoxy
        - sh.brew.privoxy
      loop_control:
        loop_var: __privoxy_launch_agent
      register: __privoxy_absent_launch_agents

    - name: Ensure privoxy configuration file and service are absent
      tags:
        - privoxy
      ansible.builtin.assert:
        that:
          - not __privoxy_absent_stat.stat.exists
          - __privoxy_absent_launchd.services | length == 0
          - __privoxy_absent_launch_agents.results | selectattr('stat.exists') | list | length == 0
...
