---
- name: Ensure privoxy state is valid
  tags:
    - privoxy
  ansible.builtin.fail:
    msg: privoxy_state must be 'present' or 'absent'.
  when:
    - privoxy_state not in ['present', 'absent']

- name: Ensure privoxy service information is gathered
  tags:
    - privoxy
  linuxhq.macos.homebrew_services_info:
    name: privoxy
  register: __privoxy_services

# community.general.homebrew_services only stops a started service, leaving a crashed one registered.
# An installed but never-started service still lists its keg plist, so stop only a service launchd knows.
- name: Ensure privoxy service is stopped
  tags:
    - privoxy
  ansible.builtin.command:
    argv:
      - brew
      - services
      - stop
      - privoxy
    removes: "{{ __privoxy_services.services[0].file }}"
  environment:
    PATH: "/usr/local/bin:/opt/homebrew/bin:{{ ansible_facts.env.PATH }}"
  register: __privoxy_stop_result
  when:
    - privoxy_state == 'absent'
    - __privoxy_services.services | length > 0
    - __privoxy_services.services[0].registered or __privoxy_services.services[0].loaded or __privoxy_services.services[0].running

- name: Ensure privoxy package is managed
  tags:
    - privoxy
  community.general.homebrew:
    name: privoxy
    state: "{{ privoxy_state }}"
    update_homebrew: false
    upgrade_all: false

- name: Ensure privoxy configuration is present
  tags:
    - privoxy
  ansible.builtin.template:
    dest: "{{ privoxy_confdir }}/config"
    mode: '0640'
    src: config.j2
  notify:
    - Restart privoxy
  when:
    - privoxy_state == 'present'

- name: Ensure privoxy configuration is absent
  tags:
    - privoxy
  ansible.builtin.file:
    path: "{{ privoxy_confdir }}/config"
    state: absent
  when:
    - privoxy_state == 'absent'

# brew services start fails to bootstrap a service launchd already loaded, such as one that crashed, so restart it.
- name: Ensure privoxy service is started
  tags:
    - privoxy
  community.general.homebrew_services:
    name: privoxy
    state: "{{ 'restarted' if __privoxy_services.services | selectattr('loaded') | rejectattr('running') | list else 'present' }}"
  when:
    - privoxy_state == 'present'
    - not ansible_check_mode
...
